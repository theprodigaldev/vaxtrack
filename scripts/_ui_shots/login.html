<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In VaxTrack</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="file:///C:/Users/HomePC/Documents/FINAL%20YEAR%20PROJECT/CURSOR/vaxtrack/app/static/style.css">
    
</head>
<body>



<!-- Public (login) page -->
<div id="toast-container"></div>
<div class="public-shell">
    
    
    
    
<div class="login-wrap">
    <div class="login-brand">
        <div style="margin-bottom:.75rem; display:flex; justify-content:center;">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                 stroke="var(--clinic)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
        </div>
        <h1>VaxTrack</h1>
        <p>Primary health centre immunisation records</p>
    </div>

    <div class="card login-card">
        <h2>Sign in to your account</h2>
        <form method="POST" action="/login" class="no-loading" id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom:1.25rem;">
                <label for="password">Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" name="password" required autocomplete="current-password" style="padding-right:2.5rem;">
                    <button type="button" id="toggle-pw" class="pw-toggle" title="Show/hide password">
                        <svg id="pw-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                Sign In
            </button>
        </form>
    </div>
</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<script src="/static/main.js"></script>
<script>
    if (typeof feather !== 'undefined') feather.replace({ 'stroke-width': 2 });
</script>

<script>
document.getElementById('toggle-pw').addEventListener('click', function() {
    var pw = document.getElementById('password');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    this.style.opacity = pw.type === 'text' ? '1' : '.5';
});
document.getElementById('login-form').addEventListener('submit', function() {
    var btn = document.getElementById('login-btn');
    btn.textContent = 'Signing in…';
    btn.disabled = true;
});
</script>

</body>
</html>
